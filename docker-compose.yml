name: meridian-kg

services:
  neo4j:
    image: neo4j:5-community
    container_name: meridian-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/meridian-dev"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512M"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p meridian-dev 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: meridian-postgres
    ports:
      - "5433:5432"   # 5433 on host: avoids a native PostgreSQL on 5432
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian-dev
      POSTGRES_DB: meridian
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  neo4j_data:
  postgres_data:
